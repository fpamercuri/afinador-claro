<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Afinador Claro</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one column, the reading (note + state) on top, big controls below, settings last. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#0d1117; --muted:#4a5260; --line:#c9ced8;
  --accent:#1747c9; --accent-fg:#ffffff; --accent-ink:#1747c9;
  --flat:#0b5cad; --sharp:#b3261e; --ok:#0f7a3a;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0d12; --surface:#151922; --fg:#f4f6fa; --muted:#aeb6c4; --line:#2e3542;
  --accent:#ffd23f; --accent-fg:#0b0d12; --accent-ink:#ffd23f;
  --flat:#6cb6ff; --sharp:#ff8a80; --ok:#5ee08c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#151922; --fg:#f4f6fa; --muted:#aeb6c4; --line:#2e3542;
  --accent:#ffd23f; --accent-fg:#0b0d12; --accent-ink:#ffd23f;
  --flat:#6cb6ff; --sharp:#ff8a80; --ok:#5ee08c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1.125rem;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.5rem;margin:0;text-wrap:balance}
h2{font-size:1.25rem;margin:0 0 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.reading{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.note{font-size:clamp(4rem,22vw,7rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.string{font-size:1.25rem;color:var(--muted);min-height:1.9rem}
.state{font-size:2rem;font-weight:700;letter-spacing:.02em;min-height:3rem;border-radius:10px;padding:4px 8px}
.state.flat{color:var(--flat)} .state.sharp{color:var(--sharp)} .state.ok{color:var(--ok)}
.cents{font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.meter{position:relative;height:28px;border-radius:14px;background:linear-gradient(90deg,var(--flat) 0 45%,var(--ok) 45% 55%,var(--sharp) 55% 100%);opacity:.9;margin-top:8px}
.meter i{position:absolute;top:-6px;width:8px;height:40px;margin-left:-4px;border-radius:4px;background:var(--fg);left:50%;transition:left .12s linear}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
.big{display:grid;gap:12px}
.tap{display:flex;flex-direction:column;justify-content:center;gap:6px;width:100%;min-height:78svh;background:var(--surface);color:var(--fg);border:3px solid var(--fg);border-radius:20px;padding:20px 16px;text-align:center;cursor:pointer;font:inherit}
.tap > span{display:block}
.tap .hint{font-size:1.5rem;font-weight:700;margin-top:16px;color:var(--accent-ink)}
.tap.listening{border-color:var(--ok);box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 35%,transparent)}
.tap:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
details.manual > summary{font-size:1.125rem}
button,select{font:inherit}
.btn{min-height:72px;border-radius:14px;border:2px solid var(--fg);background:var(--surface);color:var(--fg);font-size:1.375rem;font-weight:700;padding:12px 16px;cursor:pointer;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn:focus-visible,select:focus-visible,input:focus-visible+span{outline:4px solid var(--accent);outline-offset:3px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
select{min-height:60px;border-radius:12px;border:2px solid var(--fg);background:var(--bg);color:var(--fg);padding:8px 12px;font-size:1.2rem;width:100%}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:700;margin-bottom:6px;padding:0}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.choice span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:60px;border:2px solid var(--line);border-radius:12px;padding:6px 8px;font-weight:700}
.choice input:checked+span{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center}
.stepper output{text-align:center;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.stepper .btn{min-height:60px;font-size:1.75rem;padding:0}
.checks{display:grid;gap:8px}
.check{display:flex;align-items:center;gap:12px;min-height:56px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700}
.check input{width:28px;height:28px;accent-color:var(--accent);flex:none}
.msg{border-left:6px solid var(--sharp);padding:8px 12px;background:var(--surface)}
.note-small{color:var(--muted);font-size:1rem;margin:0}
details summary{cursor:pointer;font-weight:700;min-height:48px;display:flex;align-items:center}
.practice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>

<div class="wrap">
  <header>
    <h1>Afinador Claro</h1>
    <p class="note-small" data-i18n="intro">Se maneja hablando. Tocá en cualquier parte del recuadro y la app te va a preguntar.</p>
  </header>

  <!-- The whole box is one button: a blind user only has to touch the screen anywhere. Visual reading is for low vision. -->
  <button class="tap" id="tap" type="button" aria-label="Empezar. La app te va a hablar">
    <span class="note" id="note" aria-hidden="true">–</span>
    <span class="string" id="stringLbl" aria-hidden="true">&nbsp;</span>
    <span class="state" id="state" aria-hidden="true">&nbsp;</span>
    <span class="cents" id="cents" aria-hidden="true">&nbsp;</span>
    <span class="meter" aria-hidden="true"><i id="needle"></i></span>
    <span class="hint" id="hint" aria-hidden="true">Tocá en cualquier parte para empezar</span>
  </button>

  <div class="sr" role="status" aria-live="polite" id="live"></div>

    <button class="btn primary" id="startBtn" type="button">Empezar a afinar</button>

    </div>
    <div class="practice" id="practiceCtl" hidden>

      <button class="btn" id="upBtn" type="button" data-i18n="btn_tensar">Tensar cuerda</button>
    </div>
  </div>

  <section class="panel" aria-labelledby="hInst">
    <h2 id="hInst" data-i18n="h_inst">Instrumento</h2>
    <label class="field" for="langSel"><span data-i18n="lbl_idioma">Idioma</span>
      <select id="langSel">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>
    </label>
    <label class="field" for="tuningSel"><span data-i18n="lbl_afin">Afinación</span>
      <select id="tuningSel"></select>
    </label>
    <fieldset id="stringsFs">
      <legend data-i18n="lbl_cuerda">Cuerda a afinar</legend>
      <div class="choices" id="strings"></div>
    </fieldset>
    <div>
      <div id="a4Lbl" style="font-weight:700;margin-bottom:6px" data-i18n="lbl_a4">Referencia del La</div>
      <div class="stepper" role="group" aria-labelledby="a4Lbl">
        <button class="btn" id="a4Down" type="button" data-i18n-aria="aria_a4_menos">−</button>
        <output id="a4Out" aria-live="polite">440 Hz</output>
        <button class="btn" id="a4Up" type="button" data-i18n-aria="aria_a4_mas">+</button>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="hAvisos">
    <h2 id="hAvisos" data-i18n="h_avisos">Avisos</h2>
    <div class="checks">
      <label class="check"><input type="checkbox" id="optBeep" checked> <span data-i18n="opt_beep">Guía con sonido</span></label>
      <label class="check"><input type="checkbox" id="optVib" checked> <span id="optVibTxt" data-i18n="opt_vib">Vibración al afinar y en cada pitido (solo Android)</span></label>
    </div>
    <label class="field" for="guideSel"><span data-i18n="lbl_guia">Tipo de guía sonora</span>
      <select id="guideSel">
        <option value="park" data-i18n="opt_park">Sensor de estacionar: pitidos con tu nota, más rápidos al acercarte</option>
        <option value="bend" data-i18n="opt_bend">Bend: tu nota se desliza hasta la afinada</option>
      </select>
    </label>
    <label class="field" for="voiceSel"><span data-i18n="lbl_voz">Quién habla</span>
      <select id="voiceSel">
        <option value="tts" data-i18n="opt_tts">La voz del afinador</option>
        <option value="sr" data-i18n="opt_sr">Mi lector de pantalla (VoiceOver o TalkBack)</option>
        <option value="off" data-i18n="opt_off">Nadie, solo pitidos</option>
      </select>
    </label>
    <label class="field" for="autoSel"><span data-i18n="lbl_auto">Decir los cents solo</span>
      <select id="autoSel">
        <option value="0" data-i18n="opt_auto0">No, solo cuando toco ¿Cuánto falta?</option>
        <option value="2500" data-i18n="opt_auto25">Cada 2,5 segundos</option>
        <option value="5000" data-i18n="opt_auto5">Cada 5 segundos</option>
      </select>
    </label>
    <label class="field" for="tolSel"><span data-i18n="lbl_tol">Margen para decir afinado</span>
      <select id="tolSel">
        <option value="2" data-i18n="opt_tol2">±2 cents (exigente)</option>
        <option value="3">±3 cents</option>
        <option value="5" selected>±5 cents</option>
        <option value="10" data-i18n="opt_tol10">±10 cents (rápido)</option>
      </select>
    </label>
    <label class="field" for="namesSel"><span data-i18n="lbl_nombres">Nombres de las notas</span>
      <select id="namesSel">
        <option value="sol" data-i18n="opt_sol">Do, Re, Mi</option>
        <option value="let">C, D, E</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="optPractice"> <span data-i18n="opt_practica">Modo práctica sin micrófono</span></label>
  </section>
  </details>

  <details class="panel">
    <summary data-i18n="como">Cómo se usa</summary>
    <p class="note-small" data-i18n="como_txt"></p>
  </details>
</div>

<script>
// Interpreta lo que dice la persona (texto que devuelve el reconocimiento de voz) y lo convierte en
// instrumento, afinación, modo de guía, referencia del La, idioma y órdenes. Entiende frases libres,
// varias cosas en una sola frase y errores típicos del reconocimiento (yukelele, ben, cuatrocientos...).
// Habla tres idiomas: es (español), en (inglés) y pt (portugués de Brasil). parse(texto, idioma).
(function (root) {
"use strict";

const strip = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

// Clave fonética: junta letras que suenan igual para absorber errores de reconocimiento.
function fon(w) {
  w = strip(w).replace(/[^a-z0-9]/g, "");
  if (/^\d+$/.test(w)) return w;
  return w.replace(/qu/g, "k").replace(/c(?=[ei])/g, "s").replace(/c/g, "k").replace(/z/g, "s")
    .replace(/v/g, "b").replace(/ll/g, "y").replace(/h/g, "").replace(/w/g, "u").replace(/x/g, "ks")
    .replace(/gu(?=[ei])/g, "g").replace(/(.)\1+/g, "$1");
}

function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}

// Distancia permitida según el largo: palabras cortas exactas, largas con margen.
function allowed(a, b) { const l = Math.min(a.length, b.length); return l >= 9 ? 2 : l >= 5 ? 1 : 0; }

function analyse(text, skip) {
  const words = strip(text).split(/[^a-z0-9]+/).filter(Boolean).filter(w => !(skip && skip.includes(w)));
  const keys = [];
  words.forEach((w, i) => {
    keys.push({ k: fon(w), i });
    if (i + 1 < words.length) keys.push({ k: fon(w + words[i + 1]), i });
    if (i + 2 < words.length) keys.push({ k: fon(w + words[i + 1] + words[i + 2]), i });
  });
  // Mejor coincidencia de una palabra: 3 si es exacta, 1 si es aproximada, 0 si no está. Devuelve también la posición.
  function match(word) {
    const f = fon(word); let best = { score: 0, pos: 1e9 };
    for (const { k, i } of keys) {
      let s = 0;
      if (k === f) s = 3; else if (lev(k, f) <= allowed(k, f)) s = 1;
      if (s > best.score || (s === best.score && s > 0 && i < best.pos)) best = { score: s, pos: i };
    }
    return best;
  }
  const has = (...ws) => ws.some(w => match(w).score > 0);
  const hasExact = (...ws) => ws.some(w => match(w).score === 3);
  return { words, match, has, hasExact };
}

// Nombres de idioma: valen dichos en cualquiera de los tres idiomas.
const IDIOMAS = [
  ["es", ["espanol", "castellano", "spanish", "espanhol"]],
  ["en", ["ingles", "english"]],
  ["pt", ["portugues", "portuguese", "brasileiro"]]
];

const COMUNES = { charango: ["charango"], cavaco: ["cavaquinho", "cavaco", "cavaquinio"], banjo: ["banjo", "banyo"] };

// Vocabulario de cada idioma. Si dos instrumentos empatan, gana el que se nombró primero.

      catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veintiuno: 21, veintidos: 22,
      veintitres: 23, veinticuatro: 24, veinticinco: 25, veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29,

    // "abaixo" (para abajo) se parece demasiado a "baixo" (el instrumento): no cuenta para elegir instrumento.

    park: ["estacionar", "estacionamento", "estacionando", "sensor", "bipe", "bipes", "apito", "apitos", "parking"],

// ---------- Audio ----------
let ctx = null, analyser = null, stream = null, buf = null;
let muteUntil = 0; // detection pauses while the page itself makes sound, so it does not tune to its own beeps
function ensureCtx(){
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
function tone(freq, dur, type = "sine", gain = 0.25, when = 0){

  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  muteUntil = Math.max(muteUntil, performance.now() + (when + dur) * 1000 + 80);
}
Voz.init({lang:S.lang, getCtx:ensureCtx, vivo:live,
  modo:() => S.voice === "tts" ? "app" : S.voice,
  onBusy:b => { speaking = b; if (!b) muteUntil = performance.now() + 150; }})
  .then(ok => { vozClips = ok; if (ok) Voz.precargar(); });
const vib = p => { if (S.vib && "vibrate" in navigator) { try { navigator.vibrate(p); } catch(e) {} } };
// Moves a phone-audible copy of the played note into the 220-880 Hz range, keeping the cents offset.
function audible(f){ while (f < 220) f *= 2; while (f > 880) f /= 2; return f; }
// Bend cue: starts at the pitch you played and glides to the tuned pitch.

  o.type = "triangle";
  o.frequency.setValueAtTime(from, t0);
  o.frequency.setValueAtTime(from, t0 + 0.05);
  o.frequency.exponentialRampToValueAtTime(tgt, t0 + dur);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.3, t0 + 0.01);
  g.gain.setValueAtTime(0.3, t0 + dur - 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.04);
  o.connect(g).connect(cx.destination); o.start(t0); o.stop(t0 + dur + 0.06);
  muteUntil = Math.max(muteUntil, performance.now() + (dur + 0.06) * 1000 + 80);
  vib(c < 0 ? 120 : [40, 60, 40]);
}
// Parking-sensor cue: a short beep at the pitch you are playing right now.
function cuePark(c){
  if (S.beep) tone(audible(midiToHz(target.midi)) * Math.pow(2, c / 1200), 0.09, "triangle", 0.3);
  vib(c < 0 ? 120 : [40, 60, 40]);
}
// Arrival: the tuned note stays fixed and the phone vibrates, in both modes.
function cueInTune(){
  if (S.beep){ tone(audible(midiToHz(target.midi)), 0.9, "triangle", 0.3); }
  vib([400, 120, 400]);
}
function playReference(m){
  const c = ensureCtx(), f = midiToHz(m), t0 = c.currentTime;
  [1, 2, 3].forEach((h, i) => {
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = f * h; const peak = [0.3, 0.12, 0.06][i];
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.2);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + 2.3);
  });
  muteUntil = performance.now() + 2400;
}

// ---------- Pitch detection (YIN) ----------
function yin(x, sr, minF, maxF){
  const W = Math.floor(x.length / 2);
  const maxTau = Math.min(W - 1, Math.floor(sr / minF)), minTau = Math.max(2, Math.floor(sr / maxF));
  const d = new Float32Array(maxTau + 2);
  for (let tau = 1; tau <= maxTau + 1; tau++){
    let s = 0;
    for (let i = 0; i < W; i++){ const v = x[i] - x[i + tau]; s += v * v; }
    d[tau] = s;
  }
  let run = 0; d[0] = 1;
  for (let tau = 1; tau <= maxTau + 1; tau++){ run += d[tau]; d[tau] = run ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = minTau; t <= maxTau; t++){
    if (d[t] < 0.15){ while (t + 1 <= maxTau && d[t + 1] < d[t]) t++; tau = t; break; }
  }
  if (tau < 0){ // fall back to the global minimum when it is clear enough
    let best = 1, bt = -1;
    for (let t = minTau; t <= maxTau; t++) if (d[t] < best){ best = d[t]; bt = t; }
    if (best < 0.25) tau = bt; else return -1;
  }
  const a = d[tau - 1], b = d[tau], c = d[tau + 1];
  const den = a - 2 * b + c;
  const shift = den ? 0.5 * (a - c) / den : 0;
  return sr / (tau + (Math.abs(shift) < 1 ? shift : 0));
}

// ---------- Tracking state ----------
let running = false, practice = false, simCents = 0, simMidi = 40;
let hist = [], cents = null, target = null, lastTargetKey = null, pendingKey = null, pendingCount = 0;
let lastFarSay = 0, inTune = false, inTuneSince = 0, lastSignal = 0, nextBeep = 0, lastAuto = 0, timer = null, wake = null;

function resetTracking(){
  hist = []; cents = null; target = null; lastTargetKey = null; pendingKey = null; pendingCount = 0; inTune = false;
  if (practice) startPracticeString();
  if (!running) drawIdle();
}
function chooseTarget(f){
  const t = tuning(), m = hzToMidi(f);
  if (!t.s.length){ const n = Math.round(m); return {midi:n, idx:-1}; }
  if (S.string !== "auto"){ const i = +S.string; return {midi:t.s[i], idx:i}; }
  let bi = 0, bd = Infinity;
  t.s.forEach((sm, i) => { const dd = Math.abs(m - sm); if (dd < bd){ bd = dd; bi = i; } });
  return {midi:t.s[bi], idx:bi};
}
// Mensajes hablados: la nota se dice como se dice en cada idioma (Do Re Mi; en inglés, C D E).
const noteKey = m => "note_" + (((m % 12) + 12) % 12);
const stringParts = tg => tg.idx >= 0 ? ["cuerda_" + stringNumber(tg.idx)] : [];
const centsParts = c => Math.abs(c) <= +S.tol ? ["w_afinado"]
  : ["num_" + Math.min(66, Math.round(Math.abs(c))), "w_cents", c < 0 ? "w_grave" : "w_agudo"];
const readParts = (tg, c) => [...stringParts(tg), noteKey(tg.midi), ...centsParts(c)];

function analyse(){
  const now = performance.now();
  let f = -1;
  if (practice){
    f = midiToHz(simMidi) * Math.pow(2, simCents / 1200);
  } else {
    if (now < muteUntil || speaking) return;
    analyser.getFloatTimeDomainData(buf);
    let rms = 0; for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / buf.length);
    if (rms > 0.008){
      const t = tuning();
      const lo = t.s.length ? midiToHz(Math.min(...t.s)) * 0.6 : 25;
      const hi = t.s.length ? midiToHz(Math.max(...t.s)) * 1.7 : 2000;
      f = yin(buf, ctx.sampleRate, Math.max(22, lo), hi);
    }
  }
  if (f <= 0){
    if (now - lastSignal > 700 && cents !== null){ hist = []; cents = null; inTune = false; pendingKey = null; drawWaiting(); }
    return;
  }
  lastSignal = now;
  hist.push(f); if (hist.length > 5) hist.shift();
  const fm = hist.slice().sort((a, b) => a - b)[Math.floor(hist.length / 2)];
  const tg = chooseTarget(fm);
  const c = 1200 * Math.log2(fm / midiToHz(tg.midi));
  if (Math.abs(c) > 350){
    drawFar(fm);
    // Far from every string: say what it hears, at most every 4 s, so a blind user is never left in silence.
    if (now - lastFarSay > 4000){ lastFarSay = now; say(["escucho", noteKey(Math.round(hzToMidi(fm))), "lejos_de", ...stringParts(tg), noteKey(tg.midi)]); }
    return;
  }
  const key = tg.idx + ":" + tg.midi;
  // Announce a new note only after it holds for 3 frames, so passing noise does not trigger speech.
  if (key !== lastTargetKey){
    if (key === pendingKey) pendingCount++; else { pendingKey = key; pendingCount = 1; }
    if (pendingCount < 3) return;
    lastTargetKey = key; target = tg; cents = c; inTune = false;
    say(readParts(tg, c));
    nextBeep = now + 900; lastAuto = now;
  }
  target = tg;
  cents = cents === null ? c : cents + 0.35 * (c - cents);
  const tol = +S.tol;
  if (!inTune && Math.abs(cents) <= tol){
    if (!inTuneSince) inTuneSince = now;
    if (now - inTuneSince > 300){ inTune = true; cueInTune(); say(["w_afinado"]); }
  } else if (Math.abs(cents) > tol) inTuneSince = 0;
  if (inTune && Math.abs(cents) > tol + 3){ inTune = false; inTuneSince = 0; }
  if (!inTune && !speaking && now >= nextBeep){
    if (S.guide === "bend" && S.beep) cueBend(cents); else cuePark(cents);
    // Parking-sensor rhythm: farther away = slower beeps.
    nextBeep = now + Math.max(170, Math.min(900, 140 + Math.abs(cents) * 16));
  }
  if (+S.auto && now - lastAuto > +S.auto && !inTune){ lastAuto = now; say(centsParts(cents)); }
  draw();
}

const noteEl = $("note"), strEl = $("stringLbl"), stateEl = $("state"), centsEl = $("cents"), needle = $("needle");
function drawIdle(){ noteEl.textContent = "–"; strEl.innerHTML = "&nbsp;"; stateEl.innerHTML = "&nbsp;"; stateEl.className = "state"; centsEl.innerHTML = "&nbsp;"; needle.style.left = "50%"; }

function draw(){

    }
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 4096;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
  } else startPracticeString();
  try { wake = await navigator.wakeLock?.request("screen"); } catch(e) {}
  running = true; resetTracking(); drawWaiting();
  $("startBtn").textContent = T("btn_detener");
  if (!silent) say(practice ? ["practica"] : ["tocar_cuerda"]);
  timer = setInterval(analyse, 50);
  return true;
}
function stop(silent){
  running = false; clearInterval(timer);
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  try { wake && wake.release(); } catch(e) {}
  $("startBtn").textContent = practice ? T("btn_practica") : T("btn_empezar");
  drawIdle(); if (!silent) say(["detenido"]);
}
$("startBtn").addEventListener("click", () => running ? stop() : start());
$("askBtn").addEventListener("click", () => {
  if (!running){ say(["tocar_cuerda"]); return; }
  if (!target || cents === null){ say(["ninguna_nota"]); return; }
  say(readParts(target, cents));
});
$("refBtn").addEventListener("click", () => {
  const t = tuning();
  let m;
  if (target) m = target.midi;
  else if (t.s.length) m = t.s[S.string === "auto" ? 0 : +S.string];
  else m = 69;
  playReference(m);
  say([noteKey(m)]);
});

// ---------- Conversación por voz ----------
// Un toque en cualquier parte empieza (el navegador exige un toque antes de sonar y de escuchar).
// La app pregunta de a una cosa: qué vas a afinar, después la afinación (si el instrumento tiene varias)
// y la primera vez cómo querés que te guíe. Si en una respuesta ya decís varias cosas
// ("guitarra un tono abajo con bend"), se saltea lo que ya contestaste.
// Se puede cambiar de idioma en cualquier momento diciendo "english", "português" o "español".
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const tapEl = $("tap"), hintEl = $("hint");
let flow = "idle", qctx = null, misses = 0, rec = null, lastReading = null, askId = 0, pend = null;

function setTap(hintKey, ariaKey){ hintEl.textContent = T(hintKey); tapEl.setAttribute("aria-label", T(ariaKey || hintKey)); }
function syncUI(){ tuningSel.value = S.tuning; $("guideSel").value = S.guide; renderStrings(); setA4(S.a4); save(); }
function abortRec(){ try { rec && rec.abort(); } catch(e) {} rec = null; tapEl.classList.remove("listening"); }

// Lo que se pregunta en cada momento, y lo que se dice si no se entendió.
const QUESTION = {
  open:    () => ["pregunta_instrumento"],
  welcome: () => ["seguimos_igual"],
  tuning:  () => ["pregunta_afin_" + (pend && pend.inst || "gtr")],
  mode:    () => ["pregunta_modo"],
  a4:      () => ["pregunta_a4"],
  menu:    () => ["pausa"]
};
const ASK_AGAIN = {
  open:    () => ["no_entendi_instr"],
  welcome: () => ["no_entendi", "pregunta_instrumento"],
  tuning:  () => ["no_entendi_afin"],
  mode:    () => ["no_entendi", "pregunta_modo"],
  a4:      () => ["no_entendi", "pregunta_a4"],
  menu:    () => ["no_entendi", "pausa"]
};
// Palabra del instrumento en cada idioma: "cinco" en la pregunta de cuerdas del bajo se entiende como "bajo cinco".
const INST_WORD = {
  es: {gtr:"guitarra", bass:"bajo", uke:"ukelele"},
  en: {gtr:"guitar", bass:"bass", uke:"ukulele"},
  pt: {gtr:"violão", bass:"baixo", uke:"ukulele"}
};
const SR_LANG = {es:"es-AR", en:"en-US", pt:"pt-BR"};
const recLang = () => (navigator.language || "").toLowerCase().startsWith(S.lang) && /-/.test(navigator.language) ? navigator.language : SR_LANG[S.lang];

// Dice algo y después escucha la respuesta.
async function ask(ctxName, parts){
  abortRec(); const id = ++askId;
  flow = "asking"; qctx = ctxName;
  setTap("hint_hablar", "aria_repetir");
  await say(parts);
  if (id === askId && flow === "asking") listen(ctxName);
}
function listen(ctxName){
  if (!SR){ noVoice(); return; }
  abortRec();
  const r = new SR(); rec = r;
  r.lang = recLang(); r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
  let got = false;
  r.onresult = e => { got = true; heard([...e.results[0]].map(a => a.transcript), ctxName); };
  r.onerror = e => { if (/not-allowed|service-not-allowed|audio-capture/.test(e.error)){ got = true; noVoice(); } };
  r.onend = () => { tapEl.classList.remove("listening"); if (!got && flow === "asking" && rec === r) fail(ctxName); };
  tone(1400, 0.05, "sine", 0.2); // el "tic": ya podés hablar
  setTimeout(() => { try { r.start(); tapEl.classList.add("listening"); } catch(e){ noVoice(); } }, 120);
}
function fail(ctxName){
  misses++;
  if (misses >= 3){ misses = 0; flow = "waitTap"; setTap("hint_tocar_hablar"); say(["no_te_escucho"]); return; }
  ask(ctxName, ASK_AGAIN[ctxName]());
}
async function noVoice(){
  // Este navegador no entiende voz: se afina con lo último elegido y un toque dice cuánto falta.
  flow = "tuning"; await say(["sin_voz"]); goTune(true);
}

// Junta lo que la persona va contestando, pregunta lo que falta de a una cosa, y al final aplica todo.
function collect(p){
  pend = pend || {};
  if (p.tuning){ pend.tuning = p.tuning; pend.inst = p.instrument; pend.tuningSaid = p.tuningSaid; }
  if (p.mode) pend.mode = p.mode;
  if (p.a4 !== null) pend.a4 = p.a4;
}
function nextStep(){
  if (pend.tuning && !pend.tuningSaid && INST_WORD.es[pend.inst]) return ask("tuning", QUESTION.tuning());
  if (!pend.mode && !S.modeChosen) return ask("mode", QUESTION.mode());
  const p = pend; pend = null; return apply(p);
}

// Aplica lo elegido y confirma en voz alta solo lo que cambió.
async function apply(p){
  if (p.tuning){ S.tuning = p.tuning; S.string = "auto"; }
  if (p.mode){ S.guide = p.mode; S.modeChosen = true; }
  if (p.a4 !== undefined) setA4(p.a4);
  S.setup = true; syncUI(); misses = 0;
  const parts = ["perfecto"];
  if (p.tuning) parts.push("tuning_" + S.tuning);
  if (p.mode) parts.push("mode_" + S.guide);
  if (p.a4 !== undefined) parts.push("la_en", "w_400", "num_" + (p.a4 - 400), "w_hercios");
  if (!S.tipShown){ S.tipShown = true; save(); parts.push("tip_pausa"); }
  parts.push("tocar_cuerda");
  flow = "tuning";
  setTap(SR ? "hint_pausar" : "hint_cuanto");
  await say(parts);
  if (flow === "tuning" && !running) start(true);
}

// Cambio de idioma: textos, voz y reconocimiento pasan al idioma nuevo, y se repite la pregunta en ese idioma.
async function switchLang(l, ctxName){
  await setLang(l);
  const parts = ["idioma_ok"].concat(ctxName === "menu" || ctxName === "open" || ctxName === "tuning" || ctxName === "mode" || ctxName === "a4"
    ? QUESTION[ctxName]() : QUESTION.open());
  return ask(ctxName === "welcome" ? "open" : ctxName, parts);
}

function heard(alts, ctxName){
  const p = Interprete.parseAlternatives(alts, S.lang);
  const slot = p.instrument || p.mode || p.a4 !== null;
  if (p.lang && p.lang !== S.lang) return switchLang(p.lang, ctxName);
  if (p.cmd === "repeat"){ ask(ctxName, QUESTION[ctxName]()); return; }
  if (p.cmd === "end" && ctxName !== "open"){ pend = null; endAll(); return; }

  if (ctxName === "tuning"){
    // La respuesta se entiende junto con el instrumento: "cinco" es "bajo de cinco", "drop D" es "guitarra drop D".
    const q = Interprete.parseAlternatives(alts.map(t => INST_WORD[S.lang][pend.inst] + " " + t), S.lang);
    if (q.instrument === pend.inst && q.tuningSaid){ collect(q); return nextStep(); }
    if (q.instrument && q.instrument !== pend.inst){ collect(q); return nextStep(); } // cambió de instrumento
    if (p.yes !== null || p.cmd === "go"){ pend.tuningSaid = true; if (q.mode) pend.mode = q.mode; return nextStep(); } // "sí", "no sé": estándar
    return fail(ctxName);
  }
  if (ctxName === "mode"){
    if (p.mode){ collect(p); return pend ? nextStep() : apply(p); }
    if (p.instrument){ collect(p); return nextStep(); }
    return fail(ctxName);
  }
  if (ctxName === "a4"){ if (p.a4 !== null) return apply({a4: p.a4}); return fail(ctxName); }
  if (ctxName === "welcome"){
    if (slot){ pend = null; collect(p); return nextStep(); }
    if (p.yes === true || p.cmd === "go"){ misses = 0; flow = "tuning"; return say(["perfecto", "tocar_cuerda"]).then(() => { if (flow === "tuning" && !running) start(true); }); }
    if (p.yes === false || p.cmd === "inst"){ pend = null; return ask("open", QUESTION.open()); }
    return fail(ctxName);
  }
  if (ctxName === "open"){
    if (slot){ collect(p); return nextStep(); }
    if (p.cmd === "help") return ask("open", ["no_entendi_instr"]);
    return fail(ctxName);
  }

  // Menú de pausa: se puede decir cualquier cosa, incluso un instrumento nuevo de una.
  if (slot){ pend = null; collect(p); return nextStep(); }
  switch (p.cmd){
    case "go": return goTune();
    case "cents": return say(lastReading || ["todavia_nada"]).then(() => goTune());
    case "ref": {
      const m = lastTarget ? lastTarget.midi : (tuning().s[0] || 69);
      return say(["nota_ref"]).then(() => { playReference(m); setTimeout(goTune, 2600); });
    }
    case "inst": pend = null; return ask("open", QUESTION.open());
    case "mode": pend = {}; return ask("mode", QUESTION.mode());
    case "a4": return ask("a4", QUESTION.a4());
    case "help": return ask("menu", QUESTION.menu());
    case "end": return endAll();
  }
  return fail(ctxName);
}

async function goTune(silent){
  flow = "tuning";
  setTap(SR ? "hint_pausar" : "hint_cuanto");
  if (!silent) await say(["tocar_cuerda"]);
  if (!running){ const ok = await start(true); if (!ok){ flow = "idle"; setTap("hint_empezar", "aria_empezar"); } }
}
function pauseToTalk(){
  lastReading = target && cents !== null ? readParts(target, cents) : null;
  lastTarget = target;
  stop(true); // libera el micrófono para que pueda escucharte
  misses = 0; ask("menu", QUESTION.menu());
}
function endAll(){
  abortRec(); if (running) stop(true);
  flow = "idle"; setTap("hint_empezar", "aria_empezar");
  return say(["listo_termine"]);
}
let lastTarget = null;

tapEl.addEventListener("click", () => {
  ensureCtx(); if (vozClips) Voz.precargar();
  if (flow === "idle"){
    misses = 0; pend = null;
    if (S.setup) ask("welcome", ["hola_vuelta", "tuning_" + S.tuning, "mode_" + S.guide, "seguimos_igual"]);
    else ask("open", ["hola_primera"]);
  }
  else if (flow === "asking" || flow === "waitTap"){ const c = qctx || "open"; ask(c, QUESTION[c]()); }
  else if (flow === "tuning"){
    if (SR && !practice) pauseToTalk();
    else say(target && cents !== null ? readParts(target, cents) : ["ninguna_nota"]);
  }
});
setTap("hint_empezar", "aria_empezar");

applyI18n();
drawIdle();
})();
</script>
